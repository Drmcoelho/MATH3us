# Daily coordination sweep (ROADMAP.md §3): runs the mechanical half of
# the coordinator's checks — gate v1 (verify-claims) and gate v2
# (bundle + validate-release) over every chapter — and opens an issue on
# failure. Human-only acts (tags, D decisions, merges) stay human.
name: coordination-sweep

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install verifier dependencies
        run: |
          npm install --no-save js-yaml ajv playwright
          npx playwright install --with-deps chromium

      - name: Gate v1 — verify-claims on every chapter ledger
        run: |
          set -e
          for c in caps/*/; do
            echo "=== gate v1: $c ==="
            node tools/verify-claims.mjs "$c"
          done

      - name: Gate v2 — bundle + validate-release on every chapter
        run: |
          set -e
          for c in caps/*/; do
            echo "=== gate v2: $c ==="
            node tools/bundle.mjs "$c"
            node tools/validate-release.mjs "$c"
          done

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `coordination sweep failed — ${new Date().toISOString().slice(0,10)}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'coordination-sweep'
            });
            if (open.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ['coordination-sweep'],
              body: 'A varredura diária reprovou em pelo menos um gate. Ver o run: ' +
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
                'Protocolo: a sessão-coordenadora investiga na próxima varredura ou sob demanda ("varredura").'
            });
