# Chapter 1 — The Exhaustion. Epistemological ledger (MATH3us.md §1.4, §8).
# NOTE (E12): verification statuses below are backed by artifacts in audit/,
# produced by the oracle and audit runs registered at the end of this file.
# History: all blocks were `pending` until the canonical run of 2026-07-28;
# that run REFUTED the k=0 boundary of the error bound (invariant I6), which
# was corrected in commit d8dc136 before the passing run.

chapter: 1
claims:
  - id: chapter-01.supremum-principle
    statement: >
      Every non-empty set of real numbers bounded above has a least
      upper bound. Imported as the constitutive completeness principle
      of the real numbers; not proved in this treatise.
    kind: definition
    status: proved
    provenance: classical
    proof_mode: cited
    role: bridge
    notes: >
      Foundational import, declared in the chapter text. Chapter 6 will
      examine what fails without it (density of Q vs completeness).

  - id: chapter-01.archimedes-recurrences
    statement: >
      For the unit circle, the semiperimeters of inscribed and
      circumscribed regular polygons satisfy, under doubling of sides,
      b_{2n} = 2 a_n b_n / (a_n + b_n) (harmonic mean) and
      a_{2n} = sqrt(a_n * b_{2n}) (geometric mean), with a_6 = 3,
      b_6 = 2*sqrt(3).
    kind: theorem
    status: proved
    provenance: classical
    proof_mode: proved_here
    role: central_result
    proof_location: "#do-padrao-ao-enunciado"
    notes: >
      Content is classical (Archimedes, Measurement of a Circle). The
      proof given here is the modern half-angle verification, declared
      as such; sine and tangent enter with geometric status (ratios in
      the circle), not as series. A purely Euclidean derivation is a
      declared pending item.
    verification:
      symbolic: { status: passed, artifact: "audit/symbolic-check.md" }
      numeric: { status: passed, artifact: "audit/numeric-check.json", implementation: "tools/oracle.py" }
      edge_cases: { status: passed, artifact: "audit/edge-cases.md" }

  - id: chapter-01.monotone-trapping
    statement: >
      Along the doubling sequence n = 6, 12, 24, ..., a_n is strictly
      increasing, b_n is strictly decreasing, and a_n < b_n for all n.
    kind: theorem
    status: proved
    provenance: classical
    proof_mode: proved_here
    proof_location: "#as-provas"
    dependencies:
      - claim: "chapter-01.archimedes-recurrences"
    notes: >
      Proved by induction from the recurrences alone, via mean
      inequalities; no inclusion-of-figures argument is used.
    verification:
      symbolic: { status: passed, artifact: "audit/symbolic-check.md" }
      numeric: { status: passed, artifact: "audit/numeric-check.json", implementation: "tools/oracle.py" }
      edge_cases: { status: passed, artifact: "audit/edge-cases.md" }

  - id: chapter-01.gap-halving
    statement: >
      At each doubling, b_{2n} - a_{2n} < (1/2)(b_n - a_n); hence for
      n = 6 * 2^k, b_n - a_n <= (2*sqrt(3) - 3) / 2^k, with equality
      only at k = 0 and strict inequality for k >= 1.
    correction_log: >
      2026-07-28: first statement asserted strict < for all k; refuted
      at k = 0 by oracle invariant I6 and corrected. Recorded, not erased.
    kind: theorem
    status: proved
    provenance: classical
    proof_mode: proved_here
    role: central_result
    proof_location: "#as-provas"
    dependencies:
      - claim: "chapter-01.archimedes-recurrences"
      - claim: "chapter-01.monotone-trapping"
    verification:
      symbolic: { status: passed, artifact: "audit/symbolic-check.md" }
      numeric: { status: passed, artifact: "audit/numeric-check.json", implementation: "tools/oracle.py" }
      edge_cases: { status: passed, artifact: "audit/edge-cases.md" }

  - id: chapter-01.monotone-convergence
    statement: >
      Every increasing sequence of real numbers bounded above converges
      (to the supremum of its set of values).
    kind: theorem
    status: proved
    provenance: classical
    proof_mode: proved_here
    proof_location: "#as-provas"
    dependencies:
      - claim: "chapter-01.supremum-principle"
    verification:
      symbolic: { status: passed, artifact: "audit/symbolic-check.md" }
      numeric: { status: not_applicable }
      edge_cases: { status: not_applicable, note: "abstract theorem; no numeric edge domain" }

  - id: chapter-01.pi-common-limit
    statement: >
      The sequences a_n and b_n converge to a common limit; within this
      treatise, pi is defined as that limit, and
      |a_n - pi| <= b_n - a_n <= (2*sqrt(3) - 3)/2^k for n = 6 * 2^k.
    kind: theorem
    status: proved
    provenance: classical
    proof_mode: proved_here
    role: central_result
    proof_location: "#as-provas"
    dependencies:
      - claim: "chapter-01.monotone-trapping"
      - claim: "chapter-01.gap-halving"
      - claim: "chapter-01.monotone-convergence"
    verification:
      symbolic: { status: passed, artifact: "audit/symbolic-check.md" }
      numeric: { status: passed, artifact: "audit/numeric-check.json", implementation: "tools/oracle.py" }
      edge_cases: { status: passed, artifact: "audit/edge-cases.md" }

  - id: chapter-01.circle-identification
    statement: >
      The number pi defined by the recurrences equals the semiperimeter
      of the unit circle.
    kind: theorem
    status: conditional
    provenance: classical
    proof_mode: cited
    role: bridge
    dependencies:
      - claim: "chapter-01.pi-common-limit"
    notes: >
      Conditional on Archimedes' convexity postulate (perimeter
      monotonicity under inclusion for convex boundaries), imported and
      declared as a closed door. Reopened in Chapter 9 via arc length
      as an integral.
    verification:
      symbolic: { status: not_applicable, note: "conditional on imported postulate; see symbolic-check.md 'what this does NOT establish'" }
      numeric: { status: passed, artifact: "audit/numeric-check.json", implementation: "tools/oracle.py", note: "I7: trap contains 50-digit pi reference — consistent with, not proof of, identification" }
      edge_cases: { status: not_applicable }

  - id: chapter-01.gap-ratio-quarter
    statement: >
      The ratio (b_{2n} - a_{2n}) / (b_n - a_n) converges to 1/4.
    kind: theorem
    status: proved
    provenance: derived_in_treatise
    proof_mode: proved_here
    role: central_result
    proof_location: "#o-que-a-prova-nao-entregou"
    dependencies:
      - claim: "chapter-01.archimedes-recurrences"
      - claim: "chapter-01.gap-halving"
      - claim: "chapter-01.pi-common-limit"
    correction_log: >
      2026-07-28: preregistered as conjecture C4; first recorded as
      supported-only with proof deferred to Chapter 10. Promoted to
      theorem the same day via the exact gap factorization
      (b_2n - a_2n)/(b_n - a_n) = [a_n/(a_n+b_n)]*[sqrt(b_2n)/(sqrt(a_n)+sqrt(b_2n))],
      each bracket -> 1/2 by common convergence to pi. Found while
      designing exercise E3.1. Recorded, not erased.
      Also 2026-07-28, parallel branch: the semiperimeter-gap constant
      was written as pi^3/n^2 in notes and chapter text; the primary
      reader caught the swap - pi^3/n^2 is the AREA-gap asymptotic,
      while the semiperimeter gap satisfies n^2 (b_n - a_n) -> pi^3/2
      (numerically verified up to n = 393216). The swap reappeared in
      the parallel promotion wording (chapter text, exercise E4.2 and
      this ledger) and was fixed at merge integration. Recorded, not
      erased.
    notes: >
      The sharp asymptotic form gap ~ pi^3/(2 n^2) (exact constant) is
      NOT claimed here; it remains a closed door to Chapter 10 (E4.2).
    verification:
      symbolic: { status: passed, artifact: "audit/symbolic-check.md", note: "S6: exact factorization and limit" }
      numeric: { status: passed, artifact: "audit/numeric-check.json", implementation: "tools/oracle.py", note: "I8: independent numeric witness, ratio within 1e-4 of 0.25 at k=16" }
      edge_cases: { status: passed, artifact: "audit/edge-cases.md" }

  - id: chapter-01.elementary-apparatus-limit
    statement: >
      The elementary apparatus of this chapter (mean inequalities on the
      recurrences) cannot deliver the 1/4 contraction factor; 1/2 is
      what it proves.
    kind: conjecture
    status: refuted
    provenance: authorial
    proof_mode: not_applicable
    autopsy: >
      Refuted 2026-07-28, the same day it was preregistered (C5), while
      designing exercise E3.1: the gap admits an exact factorization —
      no estimation needed — and common convergence closes the 1/4
      limit elementarily. Full five-question autopsy in conjecturas.md.
      The surviving kernel: 1/2 is a uniform per-step bound, 1/4 is
      asymptotic, and the exact constant pi^3 still needs Chapter 10.
    priority_note: >
      Authorial meta-conjecture within this treatise about provability
      with declared tools; settled by refutation in-chapter.
    dependencies:
      - claim: "chapter-01.gap-halving"
      - claim: "chapter-01.gap-ratio-quarter"


  # ---- geometric rebuild (D3, preregistration R1-R5, 2026-07-28) ----------

  - id: chapter-01.wedge-closed-forms
    statement: >
      Via the fundamental wedge of chapter 0 specialized to the unit
      circle: a_n = n sin(pi/n) (inscribed, R = 1) and
      b_n = n tan(pi/n) (circumscribed, r = 1).
    kind: theorem
    status: proved
    provenance: classical
    proof_mode: proved_here
    proof_location: "#o-segundo-cerco"
    dependencies:
      - claim: "chapter-00.fundamental-triangle"
    notes: >
      First cross-chapter dependency of the treatise: the wedge is
      imported from the closed chapter 0 (cap-00-gate0-r1). The
      recurrences compute (Enunciado A); the wedge is where the closed
      forms come from. Cross-checked by oracle I1/I9.
    verification:
      symbolic: { status: passed, artifact: "audit/symbolic-check.md" }
      numeric: { status: passed, artifact: "audit/numeric-check.json", implementation: "tools/oracle.py" }
      edge_cases: { status: passed, artifact: "audit/edge-cases.md" }

  - id: chapter-01.area-identities
    statement: >
      For the unit circle, the polygon areas satisfy A-_n = a_n^2/b_n
      and A+_n = b_n: the outer semiperimeter IS the outer area
      (its apothem is the radius 1).
    kind: theorem
    status: proved
    provenance: classical
    proof_mode: proved_here
    role: central_result
    proof_location: "#o-segundo-cerco"
    dependencies:
      - claim: "chapter-01.wedge-closed-forms"
    notes: >
      Substance is the classical A = r*s specialized; the emphasis
      (the chapter's "outer semiperimeter" is simultaneously the outer
      area) is the founding document's. Preregistered as R1.
    verification:
      symbolic: { status: passed, artifact: "audit/symbolic-check.md" }
      numeric: { status: passed, artifact: "audit/numeric-check.json", implementation: "tools/oracle.py", note: "I9" }
      edge_cases: { status: passed, artifact: "audit/edge-cases.md" }

  - id: chapter-01.area-inherits-semiperimeter
    statement: >
      A-_{2n} = a_n exactly: the inscribed area column is the inscribed
      semiperimeter column shifted by one doubling.
    kind: theorem
    status: proved
    provenance: derived_in_treatise
    proof_mode: proved_here
    role: central_result
    proof_location: "#o-segundo-cerco"
    dependencies:
      - claim: "chapter-01.archimedes-recurrences"
      - claim: "chapter-01.area-identities"
    priority_note: >
      One line from the geometric-mean recurrence; presumably known in
      the pi-algorithm literature, but the 2026-07-28 searches
      (caps/00-inferencia/prioridade.md) did not locate it stated as
      such. Re-search before any novelty claim. Preregistered as R2.
    verification:
      symbolic: { status: passed, artifact: "audit/symbolic-check.md" }
      numeric: { status: passed, artifact: "audit/numeric-check.json", implementation: "tools/oracle.py", note: "I10: exact to Decimal-60 rounding" }
      edge_cases: { status: passed, artifact: "audit/edge-cases.md" }

  - id: chapter-01.double-siege-chain
    statement: >
      A-_n < A-_{2n} = a_n < pi < b_{2n} = A+_{2n} < A+_n along the
      doubling sequence: the area siege and the perimeter siege are the
      same staircase, stepped with a one-doubling lag; both jaws close
      on pi.
    kind: theorem
    status: proved
    provenance: derived_in_treatise
    proof_mode: proved_here
    role: central_result
    proof_location: "#o-segundo-cerco"
    dependencies:
      - claim: "chapter-01.area-identities"
      - claim: "chapter-01.area-inherits-semiperimeter"
      - claim: "chapter-01.monotone-trapping"
      - claim: "chapter-01.pi-common-limit"
    priority_note: >
      Preregistered as R3, from the founding document. Same status as
      R2: presumably classical in substance, priority not established.
    verification:
      symbolic: { status: passed, artifact: "audit/symbolic-check.md" }
      numeric: { status: passed, artifact: "audit/numeric-check.json", implementation: "tools/oracle.py", note: "I11: strict links at every step" }
      edge_cases: { status: passed, artifact: "audit/edge-cases.md" }

  - id: chapter-01.area-gap-ratio-two
    statement: >
      Delta A_n = A+_n - A-_n = (b_n - a_n)(b_n + a_n)/b_n exactly, and
      Delta A_n / (b_n - a_n) -> 2 with computable N (asymptotically,
      the area gap is exactly twice the semiperimeter gap).
    kind: theorem
    status: proved
    provenance: derived_in_treatise
    proof_mode: proved_here
    role: central_result
    proof_location: "#o-segundo-cerco"
    dependencies:
      - claim: "chapter-01.area-identities"
      - claim: "chapter-01.gap-halving"
      - claim: "chapter-01.monotone-trapping"
    notes: >
      Preregistered as R4. This theorem permanently seals the factor-2
      incident: the two gaps share order 1/n^2 with constants in exact
      ratio 2:1, which is why pi^3/n^2 belongs to areas and pi^3/(2n^2)
      to semiperimeters.
    verification:
      symbolic: { status: passed, artifact: "audit/symbolic-check.md" }
      numeric: { status: passed, artifact: "audit/numeric-check.json", implementation: "tools/oracle.py", note: "I12" }
      edge_cases: { status: passed, artifact: "audit/edge-cases.md" }

  - id: chapter-01.error-duality
    statement: >
      n^2(pi - a_n) -> pi^3/6, n^2(b_n - pi) -> pi^3/3,
      n^2(pi - A-_n) -> 2 pi^3/3, n^2(A+_n - pi) -> pi^3/3: in the
      perimeter siege the outer error dominates (2x), in the area siege
      the inner error dominates (2x) - the dominant error swaps sides.
    kind: conjecture
    status: supported
    provenance: classical
    proof_mode: computational_only
    proof_location: "#o-segundo-cerco"
    dependencies:
      - claim: "chapter-01.area-identities"
      - claim: "chapter-01.area-gap-ratio-two"
    notes: >
      Preregistered as R5 (founding document). The two consistency
      identities - (pi - a) + (b - pi) = b - a forcing pi^3/6 + pi^3/3
      = pi^3/2 (the E4.2 constant), and pi - A- = (pi - a) + a(b - a)/b
      forcing 2 pi^3/3 = pi^3/6 + pi^3/2 - are exact algebra, proved
      in-chapter. The four individual constants are classical
      asymptotics whose proof needs the local expansions of chapter 10:
      same closed door as E4.2, now with four locks.
    verification:
      symbolic: { status: not_applicable, note: "conjecture; only the consistency identities are proved (symbolic-check S7)" }
      numeric: { status: passed, artifact: "audit/numeric-check.json", implementation: "tools/oracle.py", note: "I13: support at deep k, relative dev < 1e-9; consistency identities exact" }
      edge_cases: { status: passed, artifact: "audit/edge-cases.md" }

# --- execution registry (E12): who witnessed what, when -------------------
oracle_run:
  script: tools/oracle.py
  report: caps/01-exaustao/audit/numeric-check.json
  edge_report: caps/01-exaustao/audit/edge-cases.md
  code_commit: f770cc9
  environment: "python 3.12, stdlib only, linux"
  date: 2026-07-28
  tested_domain:
    n: "6 * 2^k"
    k: { min: 0, max: 16 }
    decimal_deep_k: 40
    adversarial_n_refused: [7, 100]
  implementations:
    - "float64 mean recurrences (mirrors in-page JS)"
    - "float64 closed trig forms n*sin(pi/n), n*tan(pi/n)"
    - "Decimal 60-digit mean recurrences"
  result: all_passed
  rerun_2026_07_28_rebuild: >
    Geometric rebuild (D3): invariants I9-I13 added for preregistered
    R1-R5 (area identities, inheritance, double-siege chain, gap ratio
    -> 2, duality support); full oracle re-run 13/13 plus edge cases;
    gate v0 audit re-run with new checks (3 canvases, area and
    normalized tables mirroring state, inheritance visible in DOM,
    plot painted in both modes).
  incident: >
    First run (same date) FAILED invariant I6: the error bound as first
    stated was false at k=0 (equality, not strict inequality). Statement
    corrected in chapter, symbolic check and ledger (commit d8dc136);
    second run passed. Recorded per the honesty clause.

audit_run:
  script: tools/audit.mjs
  report: caps/01-exaustao/audit/interaction-report.json
  screenshots: [caps/01-exaustao/audit/desktop.png, caps/01-exaustao/audit/iphone.png]
  code_commit: f770cc9
  gate: v0
  date: 2026-07-28
  result: all_passed
  render_seen: true
  history: >
    Run 1 (commit d8dc136) passed but did not exercise the magnifier
    across the zoom range nor engine-specific arc rasterization. A
    primary-reader report on iOS exposed (a) a blank magnifier at high
    zoom (canvas arc rasterization under giant transforms) and (b)
    coincident contact families that read as woven curves. Rendering
    was rewritten in device coordinates with adaptive sampling, contact
    families offset and marked, out-of-field annotations added (commit
    34d28c4), and a new invariant was added: magnifier never blank
    across the zoom range. That invariant's own first run produced a
    false failure by sampling aliasing (stride-40 pixel reads missing
    thin vertical traces) — an observation-layer artifact, fixed by
    reading every pixel. Run 2 passed 23/23 checks per viewport pair.
