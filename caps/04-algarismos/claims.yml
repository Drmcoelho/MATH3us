# Chapter 4 — Os Algarismos Repetidos. Epistemological ledger (MATH3us.md §1.4, §8).
# NOTE (E12): verification statuses below are backed by artifacts in audit/,
# produced by the oracle and audit runs registered at the end of this file.
# Site status: the personal site (8, 80, 44, 0.142857...) is UNMINED; this
# ledger contains no claim sourced from memory (sources.md declares the gap).

chapter: 4
claims:
  - id: chapter-04.fta-import
    statement: >
      Every integer n >= 2 factors uniquely into primes (Fundamental
      Theorem of Arithmetic). Imported as a declared foundation; not
      proved in this treatise's first cycle chapters so far.
    kind: definition
    status: proved
    provenance: classical
    proof_mode: cited
    role: bridge
    notes: >
      Foundational import, declared in the chapter text (sections 5.2 and
      5.6). Chapter 2 already leaned on it; a treatise-internal proof
      remains a candidate for a future revision of Part I.

  - id: chapter-04.division-machine-invariant
    statement: >
      The base-b expansion of a/d is generated by the state machine
      u_k = floor(b*r_{k-1}/d), r_k = b*r_{k-1} mod d, and satisfies
      a*b^k = d*(q*b^k + U_k) + r_k, i.e. r_k = a*b^k mod d. Digits lie
      in {0,...,b-1}; the expansion terminates iff some r_k = 0.
    kind: lemma
    status: proved
    provenance: classical
    proof_mode: proved_here
    role: supporting_result
    proof_location: "#definicao-expansao"
    dependencies:
      - claim: "chapter-04.fta-import"
    notes: >
      Content is classical (long division); the state-machine redaction
      with the explicit invariant is this treatise's wording, declared
      as such in sources.md.
    verification:
      symbolic: { status: passed, artifact: "audit/symbolic-check.md", note: "S1" }
      numeric: { status: passed, artifact: "audit/numeric-check.json", implementation: "caps/04-algarismos/oracle.py", note: "implementation A realizes the machine; I1-I4 exercise it across the whole domain" }
      edge_cases: { status: passed, artifact: "audit/edge-cases.md" }

  - id: chapter-04.expansion-depends-on-value
    statement: >
      The digit stream produced by the machine depends only on the value
      a/d, not on the representing pair; hence any termination criterion
      must read the reduced denominator (3/6 terminates in base 10 while
      2/6 = 1/3 does not: the unreduced denominator 6 predicts neither).
    kind: theorem
    status: proved
    provenance: classical
    proof_mode: proved_here
    role: supporting_result
    proof_location: "#reducao-necessaria"
    dependencies:
      - claim: "chapter-04.division-machine-invariant"
    verification:
      symbolic: { status: passed, artifact: "audit/symbolic-check.md", note: "S2" }
      numeric: { status: passed, artifact: "audit/numeric-check.json", implementation: "caps/04-algarismos/oracle.py", note: "unreduced 2/6 and 3/6 runs in edge cases; reductions recorded" }
      edge_cases: { status: passed, artifact: "audit/edge-cases.md" }

  - id: chapter-04.euclid-gauss-lemma
    statement: >
      If d divides a*m and gcd(a, d) = 1, then d divides m.
    kind: lemma
    status: proved
    provenance: classical
    proof_mode: proved_here
    role: supporting_result
    proof_location: "#criterio-terminacao"
    dependencies:
      - claim: "chapter-04.fta-import"
    notes: >
      Classical (Elements VII / Disquisitiones); short valuation proof
      included in the chapter.
    verification:
      symbolic: { status: passed, artifact: "audit/symbolic-check.md", note: "S3" }
      numeric: { status: not_applicable, note: "abstract divisibility lemma; exercised indirectly by I1-I3" }
      edge_cases: { status: not_applicable }

  - id: chapter-04.termination-criterion
    statement: >
      For reduced a/d (gcd(a,d) = 1, d >= 1) and integer base b >= 2,
      the following are equivalent: (i) the base-b expansion of a/d is
      finite; (ii) there is k with d | b^k; (iii) every prime factor of
      d divides b. Both directions proved.
    kind: theorem
    status: proved
    provenance: classical
    proof_mode: proved_here
    role: central_result
    proof_location: "#criterio-terminacao"
    dependencies:
      - claim: "chapter-04.division-machine-invariant"
      - claim: "chapter-04.euclid-gauss-lemma"
      - claim: "chapter-04.expansion-depends-on-value"
    verification:
      symbolic: { status: passed, artifact: "audit/symbolic-check.md", note: "S3, both directions" }
      numeric: { status: passed, artifact: "audit/numeric-check.json", implementation: "caps/04-algarismos/oracle.py", note: "I3 over all reduced a/d, d <= 2000, 7 bases" }
      edge_cases: { status: passed, artifact: "audit/edge-cases.md" }

  - id: chapter-04.base-incorporation
    statement: >
      Terminating reduced denominators are exactly 2^i*5^j in base 10,
      2^i*3^j in base 12, and 2^i*3^j*5^k in base 60: each base
      incorporates precisely the primes of its own factorization.
    kind: theorem
    status: proved
    provenance: classical
    proof_mode: proved_here
    role: supporting_result
    proof_location: "#consequencias-bases"
    dependencies:
      - claim: "chapter-04.termination-criterion"
    verification:
      symbolic: { status: passed, artifact: "audit/symbolic-check.md", note: "S7" }
      numeric: { status: passed, artifact: "audit/numeric-check.json", implementation: "caps/04-algarismos/oracle.py", note: "I3 covers bases 10, 12, 60 among others" }
      edge_cases: { status: passed, artifact: "audit/edge-cases.md" }

  - id: chapter-04.euclid-infinitude
    statement: >
      There are infinitely many primes.
    kind: theorem
    status: proved
    provenance: classical
    proof_mode: proved_here
    role: bridge
    proof_location: "#euclides"
    dependencies:
      - claim: "chapter-04.fta-import"
    notes: >
      Euclid, Elements IX.20; the classical short proof is reproduced in
      the chapter.
    verification:
      symbolic: { status: passed, artifact: "audit/symbolic-check.md", note: "S7" }
      numeric: { status: not_applicable, note: "infinitude is not numerically testable" }
      edge_cases: { status: not_applicable }

  - id: chapter-04.no-base-holds-all-primes
    statement: >
      No finite integer base incorporates all primes: for every b >= 2
      there are infinitely many primes p not dividing b, and for each of
      them 1/p has an infinite (purely periodic) base-b expansion.
    kind: theorem
    status: proved
    provenance: classical
    proof_mode: proved_here
    role: central_result
    proof_location: "#consequencias-bases"
    dependencies:
      - claim: "chapter-04.termination-criterion"
      - claim: "chapter-04.euclid-infinitude"
    verification:
      symbolic: { status: passed, artifact: "audit/symbolic-check.md", note: "S7" }
      numeric: { status: passed, artifact: "audit/numeric-check.json", implementation: "caps/04-algarismos/oracle.py", note: "finite witnesses only (I3, I7); the universal statement rests on the proof" }
      edge_cases: { status: passed, artifact: "audit/edge-cases.md" }

  - id: chapter-04.frontier-moves-never-vanishes
    statement: >
      Changing base moves the periodicity frontier but never removes it:
      every reduced a/d admits a base with finite expansion (e.g. b = d
      for d >= 2), and every base leaves infinitely many fractions
      periodic.
    kind: theorem
    status: proved
    provenance: classical
    proof_mode: proved_here
    role: supporting_result
    proof_location: "#consequencias-bases"
    dependencies:
      - claim: "chapter-04.termination-criterion"
      - claim: "chapter-04.no-base-holds-all-primes"
    verification:
      symbolic: { status: passed, artifact: "audit/symbolic-check.md", note: "S7" }
      numeric: { status: passed, artifact: "audit/numeric-check.json", implementation: "caps/04-algarismos/oracle.py", note: "I7: 1/7 finite in base 7, periodic in bases 10/12/16/60; 1/3 finite in base 3" }
      edge_cases: { status: passed, artifact: "audit/edge-cases.md" }

  - id: chapter-04.digit-remainder-periodicity
    statement: >
      The minimal pre-period and period of the digit stream equal those
      of the remainder sequence: if digits are eventually t-periodic from
      position i then r_i = r_{i+t}. Proved without infinite series.
    kind: lemma
    status: proved
    provenance: classical
    proof_mode: proved_here
    role: supporting_result
    proof_location: "#maquina-de-restos"
    dependencies:
      - claim: "chapter-04.division-machine-invariant"
    notes: >
      Content is classical folklore; the growth-inequality redaction that
      avoids series (so the lemma is available before Chapter 9's
      analytic machinery) is this treatise's wording.
    verification:
      symbolic: { status: passed, artifact: "audit/symbolic-check.md", note: "S4" }
      numeric: { status: passed, artifact: "audit/numeric-check.json", implementation: "caps/04-algarismos/oracle.py", note: "I1/I2 read periods off digits produced by remainders" }
      edge_cases: { status: passed, artifact: "audit/edge-cases.md" }

  - id: chapter-04.period-equals-order
    statement: >
      For gcd(d, b) = 1, d > 1, gcd(a, d) = 1: the base-b expansion of
      a/d is purely periodic and its minimal period is ord_d(b), the
      multiplicative order of b modulo d, independently of a.
    kind: theorem
    status: proved
    provenance: classical
    proof_mode: proved_here
    role: central_result
    proof_location: "#periodo-ordem"
    dependencies:
      - claim: "chapter-04.division-machine-invariant"
      - claim: "chapter-04.digit-remainder-periodicity"
    verification:
      symbolic: { status: passed, artifact: "audit/symbolic-check.md", note: "S5 (pigeonhole + cancellation)" }
      numeric: { status: passed, artifact: "audit/numeric-check.json", implementation: "caps/04-algarismos/oracle.py", note: "I2/I4: machine period vs order by successive powers, whole domain; edge case d = 9973" }
      edge_cases: { status: passed, artifact: "audit/edge-cases.md" }

  - id: chapter-04.preperiod-period-split
    statement: >
      Write d = d_b * d' with d_b carrying the primes of d dividing b and
      gcd(d', b) = 1. For reduced a/d the minimal pre-period is
      nu = max_p ceil(v_p(d)/v_p(b)) over p | d_b (the least k with
      d_b | b^k) and the minimal period is ord_{d'}(b) (finite expansion
      exactly when d' = 1), both independent of a.
    kind: theorem
    status: proved
    provenance: classical
    proof_mode: proved_here
    role: central_result
    proof_location: "#cisao"
    dependencies:
      - claim: "chapter-04.division-machine-invariant"
      - claim: "chapter-04.digit-remainder-periodicity"
      - claim: "chapter-04.euclid-gauss-lemma"
    notes: >
      Subsumes the termination criterion (d' = 1) and the coprime case
      (d_b = 1); stated and proved via the return equation split by the
      two structural coprimalities.
    verification:
      symbolic: { status: passed, artifact: "audit/symbolic-check.md", note: "S6" }
      numeric: { status: passed, artifact: "audit/numeric-check.json", implementation: "caps/04-algarismos/oracle.py", note: "I1/I2: independent implementations A vs B agree on all reduced a/d, d <= 2000, 7 bases" }
      edge_cases: { status: passed, artifact: "audit/edge-cases.md" }

  - id: chapter-04.seven-full-reptend
    statement: >
      1/7 = 0.142857... in base 10 with minimal period 6 = ord_7(10) =
      7 - 1: seven is a full-reptend prime in base 10 (its remainder
      cycle visits every nonzero residue). In base 7, 1/7 = 0.1 exactly.
    kind: theorem
    status: proved
    provenance: classical
    proof_mode: proved_here
    role: example
    proof_location: "#o-sete"
    dependencies:
      - claim: "chapter-04.period-equals-order"
      - claim: "chapter-04.termination-criterion"
    verification:
      symbolic: { status: passed, artifact: "audit/symbolic-check.md", note: "S5/S8 instantiated; the six-step table is finite arithmetic" }
      numeric: { status: passed, artifact: "audit/numeric-check.json", implementation: "caps/04-algarismos/oracle.py", note: "I5, I6, I7" }
      edge_cases: { status: passed, artifact: "audit/edge-cases.md" }

  - id: chapter-04.cyclic-permutation-theorem
    statement: >
      For p a full-reptend prime in base b with fundamental block
      B = (b^{p-1} - 1)/p, the multiples m*B for m = 1..p-1 are exactly
      the p-1 cyclic rotations of B, each once. For p = 7, b = 10 this is
      the 142857 phenomenon as a structural consequence.
    kind: theorem
    status: proved
    provenance: classical
    proof_mode: proved_here
    role: central_result
    proof_location: "#permutacoes-ciclicas"
    dependencies:
      - claim: "chapter-04.period-equals-order"
      - claim: "chapter-04.seven-full-reptend"
    verification:
      symbolic: { status: passed, artifact: "audit/symbolic-check.md", note: "S8" }
      numeric: { status: passed, artifact: "audit/numeric-check.json", implementation: "caps/04-algarismos/oracle.py", note: "I5: rotations set equals multiples set; 7*142857 = 999999" }
      edge_cases: { status: passed, artifact: "audit/edge-cases.md" }

  - id: chapter-04.numeral-vs-number-synthesis
    statement: >
      The site's fascination (8, 80, 44, the repeating 142857) lives in
      the numeral/representation layer; the invariant that explains it
      (the map b -> ord_d(b) and the prime factorization of the base)
      lives in the number layer. Period length is a representational
      artifact; the order function is arithmetic.
    kind: synthesis
    status: supported
    provenance: authorial
    proof_mode: not_applicable
    role: bridge
    priority_note: >
      Authorial synthesis within this treatise (organization of classical
      results into the object/representation doctrine of section 2.1);
      historical priority not established.
    dependencies:
      - claim: "chapter-04.period-equals-order"
      - claim: "chapter-04.frontier-moves-never-vanishes"

  - id: chapter-04.artin-question
    statement: >
      Are there infinitely many primes p for which 10 (or any fixed
      non-square integer > 1) is a primitive root, i.e. infinitely many
      full-reptend primes in base 10? Open (Artin 1927; conditional under
      GRH by Hooley 1967).
    kind: question
    status: open
    provenance: classical
    proof_mode: not_applicable
    role: bridge
    dependencies:
      - claim: "chapter-04.seven-full-reptend"
    notes: >
      Declared closed door, outside the first cycle (manual section 11,
      analytic number theory). Exercise E4.1 states the exact obstacle.

